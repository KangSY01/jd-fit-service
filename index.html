<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JD 맞춤 지원서 초안기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">JD 맞춤 지원서 초안기</div>
    <button class="btn-login" id="loginBtn">로그인</button>
  </header>

  <div class="wrap">
    <p class="sub">채용공고와 내 프로젝트 정보로 지원 준비를 도와드립니다.</p>
    <a class="btn btn-hero" href="analyze.html">분석 시작하기</a>

    <div class="card-row">
      <div class="card">
        <span class="icon">📋</span>
        <h3>공고 요약</h3>
        <p>핵심 내용을 한눈에</p>
      </div>
      <div class="arrow-circle">→</div>
      <div class="card">
        <span class="icon">✅</span>
        <h3>자격요건 체크</h3>
        <p>충족 여부와 근거까지</p>
      </div>
      <div class="arrow-circle">→</div>
      <div class="card">
        <span class="icon">🎯</span>
        <h3>추천 프로젝트</h3>
        <p>공고에 맞는 프로젝트 선별</p>
      </div>
      <div class="arrow-circle">→</div>
      <div class="card">
        <span class="icon">✍️</span>
        <h3>문구 초안</h3>
        <p>이력서 자소서용 초안까지</p>
      </div>
    </div>

    <div class="card need-card" style="margin-top:14px;">
      <h3>📝 필요한 것</h3>
      <ul>
        <li>지원하려는 공고 URL 또는 텍스트</li>
        <li>내 프로젝트 정보 — GitHub 링크 또는 설명</li>
      </ul>
    </div>

    <div class="small">
      근거 없는 추천 허위 스펙은 만들지 않습니다.<br>
      결과는 초안이며 제출 전 직접 다듬어 주세요.
    </div>
  </div>
</body>
</html>
